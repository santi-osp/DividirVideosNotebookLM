<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="splitlyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b22"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6ff54"/>
      <stop offset="100%" stop-color="#91f038"/>
    </linearGradient>
    <linearGradient id="splitLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a6ff4d" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#splitlyBg)" stroke="url(#splitLine)" stroke-width="2"/>

  <!-- Splitly Dynamic "S" Slash Mark (Split Timeline & Play Element) -->
  <g filter="url(#glow)">
    <!-- Top-left segment -->
    <path d="M 34 32 C 34 26 39 22 46 22 L 72 22 C 77 22 81 25 83 29 L 43 77 C 38 77 34 73 34 68 Z" fill="url(#limeGrad)"/>
    <!-- Bottom-right segment -->
    <path d="M 45 99 C 47 95 51 92 56 92 L 82 92 C 89 92 94 88 94 82 L 94 54 C 94 48 89 44 82 44 L 62 44 C 57 44 53 47 51 51 L 91 103 C 92 104 94 106 94 106 Z" fill="none"/>
    <path d="M 52 51 L 92 103 C 94 106 90 106 82 106 L 56 106 C 49 106 44 101 44 95 L 44 84 C 44 79 48 75 53 75 L 85 37 C 91 40 94 46 94 53 L 94 62 C 94 67 90 71 85 71 Z" fill="none"/>
    <!-- Clean Minimalist Segment 1 (Top Wave Block) -->
    <path d="M 38 32 C 38 27 42 24 48 24 L 76 24 C 84 24 88 30 84 36 L 44 84 C 39 84 38 80 38 75 Z" fill="url(#limeGrad)"/>
    <!-- Clean Minimalist Segment 2 (Bottom Wave Block) -->
    <path d="M 90 96 C 90 101 86 104 80 104 L 52 104 C 44 104 40 98 44 92 L 84 44 C 89 44 90 48 90 53 Z" fill="#ffffff" fill-opacity="0.92"/>
    <!-- Central Cutting Precision Axis -->
    <circle cx="64" cy="64" r="5" fill="#a6ff4d"/>
  </g>
</svg>
