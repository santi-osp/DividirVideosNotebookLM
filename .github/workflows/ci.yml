name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Check i18n parity
        run: npm run check:i18n

      - name: Run unit test suite
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Validate documentation & assets
        run: npm run check:docs
